# Builds Macron's installer DMG (ci/package) on a GitHub macOS runner and
# uploads it as an artifact. Publishing it as a GitHub release is a separate,
# deliberate step: it runs only on main and only when the publish input is set.
# With from_run it publishes the DMG an earlier run of this workflow built on
# main, without building again, so the file that was tested on a sandbox
# (ci/steam-play/gate3.sh) is the file that is released, byte for byte.
#
# Manual trigger only. Never add a pull_request, push or schedule trigger here.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, x.y.z
        required: true
        default: 0.1.0
      publish:
        description: Publish the DMG as release v<version> (main only)
        type: boolean
        default: false
      from_run:
        description: Publish the DMG this earlier Release run built (run id) instead of building again
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    if: inputs.from_run == ''
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build the DMG
        env:
          VERSION: ${{ inputs.version }}
        run: ci/package/build.sh "$VERSION" out
      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "out/Macron-$VERSION.dmg"
          pkgutil --expand "$RUNNER_TEMP/dmg/Macron.pkg" "$RUNNER_TEMP/pkg"
          {
            echo '```'
            cat "out/Macron-$VERSION.dmg.sha256"
            ls -l "$RUNNER_TEMP/dmg"
            pkgutil --payload-files "$RUNNER_TEMP/dmg/Macron.pkg"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir "$RUNNER_TEMP/payload"
          tar -xf "$RUNNER_TEMP/pkg/macron.pkg/Payload" -C "$RUNNER_TEMP/payload"
          lipo -info "$RUNNER_TEMP/payload/usr/local/bin/macron" | tee -a "$GITHUB_STEP_SUMMARY"
          hdiutil detach "$RUNNER_TEMP/dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macron-dmg
          path: out/
          if-no-files-found: error

  publish:
    needs: build
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.from_run != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      BUILT_BY: ${{ inputs.from_run || github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: The run that built the DMG is a successful Release run on main
        run: |
          set -euo pipefail
          [[ $BUILT_BY =~ ^[0-9]+$ ]] || { echo "::error::from_run must be a run id, got '$BUILT_BY'"; exit 1; }
          [ "$BUILT_BY" = "$GITHUB_RUN_ID" ] && exit 0
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILT_BY" --jq '[.path, .head_branch, .conclusion, .head_sha] | @tsv')
          IFS=$'\t' read -r path branch conclusion sha <<< "$run"
          if [ "$path" != .github/workflows/release.yml ] || [ "$branch" != main ] || [ "$conclusion" != success ]; then
            echo "::error::run $BUILT_BY is $path on $branch ($conclusion); want a successful Release run on main"
            exit 1
          fi
          echo "BUILT_SHA=$sha" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: macron-dmg
          path: out
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Publish the release
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.from_run || github.run_id }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already published; pick a new version" >&2
            exit 1
          fi
          [ -f "out/Macron-$VERSION.dmg" ] || { echo "::error::that run built no Macron-$VERSION.dmg"; ls out; exit 1; }
          (cd out && shasum -a 256 -c "Macron-$VERSION.dmg.sha256")
          source_sha=${BUILT_SHA:-$GITHUB_SHA}
          { cat docs/install.md; echo; echo "Built by $RUN_URL from $source_sha. SHA-256: \`$(cut -d ' ' -f 1 "out/Macron-$VERSION.dmg.sha256")\`"; } > notes.md
          gh release create "$tag" --target "$source_sha" --title "Macron $VERSION" \
            --notes-file notes.md "out/Macron-$VERSION.dmg" "out/Macron-$VERSION.dmg.sha256"
