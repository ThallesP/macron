name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        module: [., tools/sandbox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - name: Vet and test
        working-directory: ${{ matrix.module }}
        run: |
          go vet ./...
          go test ./...
      - name: Cross-compile for macOS and Windows
        if: matrix.module == '.'
        run: |
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...
