# Builds the DXMT modules Macron's patches change (runtime/dxmt: d3d11.dll,
# winemetal.dll and winemetal.so) on a GitHub macOS runner and, when started
# on main, publishes them as a release asset that internal/wineruntime pins by
# URL and SHA-256. DXMT is LGPL: the release carries the patches and the
# patched source files and names the exact source it was built from.
# winemetal.so links LLVM statically; that build is kept in the Actions cache.
#
# Manual trigger only. Never add a pull_request, push or schedule trigger here.
name: DXMT build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: The LLVM pin
        id: llvm
        run: |
          . runtime/dxmt/release.env
          echo "key=dxmt-llvm-$LLVM_COMMIT-macos-$MACOS_TARGET-x86_64" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/work/llvm-darwin
          key: ${{ steps.llvm.outputs.key }}
      - name: Build the patched modules
        run: runtime/dxmt/build.sh "$RUNNER_TEMP/work" out
      - name: Summary
        if: always()
        run: |
          { echo '```'; cat out/overlay/share/macron/dxmt/VERSION; cat out/*.sha256; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: dxmt-overlay
          path: out/*.tar.xz*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dxmt-overlay
          path: out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          . runtime/dxmt/release.env
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG is already published; bump RELEASE_TAG in runtime/dxmt/release.env" >&2
            exit 1
          fi
          sha=$(cut -d ' ' -f 1 "out/$ASSET_NAME.sha256")
          cp runtime/dxmt/patches/*.patch out/
          patches=$(cd out && ls *.patch)
          {
            echo "DXMT $DXMT_TAG's \`d3d11.dll\` and \`winemetal.dll\` (x86_64 and i386) and \`winemetal.so\` with Macron's patches, as an overlay for DXMT's [$DXMT_TAG release](https://github.com/3Shain/dxmt/releases/tag/$DXMT_TAG) in Macron's DXMT tree. Unpack it over that tree. What the patches do is in [runtime/dxmt/README.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/runtime/dxmt/README.md)."
            echo
            echo "- \`$ASSET_NAME\`: SHA-256 \`$sha\`"
            echo "- Source: DXMT \`$DXMT_TAG\` (commit \`$DXMT_COMMIT\`, $DXMT_REPO) with these patches, attached below and in the archive under \`share/macron/dxmt/\` next to the patched source files (\`patched-source.tar.gz\`):"
            for patch in $patches; do
              echo "  - [\`$patch\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/runtime/dxmt/patches/$patch)"
            done
            echo "- Built by $RUN_URL from $GITHUB_SHA with [runtime/dxmt/build.sh]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/runtime/dxmt/build.sh)."
            echo
            echo "DXMT and these patches are licensed under the GNU LGPL 2.1 or later; the licence text is in the archive under \`share/macron/dxmt/LICENSE\`. \`winemetal.so\` statically links LLVM \`$LLVM_TAG\` (commit \`$LLVM_COMMIT\`, $LLVM_REPO), under the Apache License 2.0 with LLVM exceptions (\`share/macron/dxmt/LLVM-LICENSE.TXT\`)."
          } > notes.md
          gh release create "$RELEASE_TAG" --latest=false --target "$GITHUB_SHA" --title "DXMT ${DXMT_TAG#v} for Macron (${RELEASE_TAG#runtime-dxmt-})" \
            --notes-file notes.md "out/$ASSET_NAME" "out/$ASSET_NAME.sha256" $(for patch in $patches; do echo "out/$patch"; done)
